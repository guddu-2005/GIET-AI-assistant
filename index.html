        try {
          if (typeof window !== 'undefined') {
            var _fetch = window.fetch;
            var winProto = (typeof Object.getPrototypeOf === 'function' && Object.getPrototypeOf(window)) || Window.prototype;
            
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(fn) { _fetch = fn; },
              configurable: true,
              enumerable: true
            });

            if (winProto && winProto !== Object.prototype) {
              try {
                Object.defineProperty(winProto, 'fetch', {
                  get: function() { return _fetch; },
                  set: function(fn) { _fetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              } catch(e) {}
            }
          }
        } catch(err) {
          console.warn('Fetch patch initialized:', err);
        }
      })();
